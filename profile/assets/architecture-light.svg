<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1022" width="900" height="1022" role="img" aria-label="The AxonOS stack, from electrodes to applications, with a privacy boundary that raw neural data never crosses."><rect width="900" height="1022" rx="18" fill="#ffffff"/><rect x="30" y="30" width="840" height="104" rx="14" fill="#f6f8fa" stroke="#000000" stroke-opacity="0.14" stroke-width="1.2"/><text x="58" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#1f2328">Applications</text><text x="842" y="74" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#8c959f">via axonos-sdk</text><text x="58" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#57606a">Receive typed, consent-bound intent events</text><line x1="30" y1="170" x2="870" y2="170" stroke="#0a84b8" stroke-width="2" stroke-dasharray="10 7"/><rect x="147.0" y="154" width="606" height="32" rx="16" fill="#ffffff"/><text x="450.0" y="177" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.5" fill="#0a84b8">PRIVACY BOUNDARY · RAW NEURAL DATA NEVER CROSSES</text><rect x="30" y="206" width="840" height="104" rx="14" fill="#f6f8fa" stroke="#000000" stroke-opacity="0.14" stroke-width="1.2"/><text x="58" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#1f2328">SDK · Protocol</text><text x="842" y="250" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#8c959f">axonos-sdk · axonos-protocol</text><text x="58" y="290" font-family="-apple-system, BlinkMacSystemFo