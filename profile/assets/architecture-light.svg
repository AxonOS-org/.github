SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0a84b8">WCRT ≤ 1,000 µs · proven</text><rect x="352" y="594" width="251" height="34" rx="17" fill="#e3f4fa" stroke="#0a84b8" stroke-opacity="0.55"/><text x="369" y="617" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0a84b8">IPC ≤ 0.5 µs · proven</text><rect x="30" y="652" width="840" height="104" rx="14" fill="#f6f8fa" stroke="#000000" stroke-opacity="0.14" stroke-width="1.2"/><text x="58" y="698" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#1f2328">Signal pipeline</text><text x="842" y="696" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#8c959f">axonos-signal-pipeline</text><text x="58" y="736" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#57606a">Conditioning · DSP · classification, bit-exact</text><rect x="30" y="770" width="840" height="104" rx="14" fill="#f6f8fa" stroke="#000000" stroke-opacity="0.14" stroke-width="1.2"/><text x="58" y="816" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#1f2328">Hardware abstraction</text><text x="842" y="814" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#8c959f">axonos-hal</text><text x="58" y="854" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#57606a">ARM Cortex-M · #![no_std] Rust</text><rect x="30" y="888" width="840" height="104" rx="14" fill="#f6f8fa" stroke="#000000" stroke-opacity="0.14" stroke-width="1.2"/><text x="58" y="934" font