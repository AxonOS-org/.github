<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1022" width="900" height="1022" role="img" aria-label="The AxonOS stack, from electrodes to applications, with a privacy boundary that raw neural data never crosses."><rect width="900" height="1022" rx="18" fill="#0d1117"/><rect x="30" y="30" width="840" height="104" rx="14" fill="#11161d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><text x="58" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Applications</text><text x="842" y="74" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#6e7681">via axonos-sdk</text><text x="58" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">Receive typed, consent-bound intent events</text><line x1="30" y1="170" x2="870" y2="170" stroke="#2dd4ff" stroke-width="2" stroke-dasharray="10 7"/><rect x="147.0" y="154" width="606" height="32" rx="16" fill="#0d1117"/><text x="450.0" y="177" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.5" fill="#2dd4ff">PRIVACY BOUNDARY · RAW NEURAL DATA NEVER CROSSES</text><rect x="30" y="206" width="840" height="104" rx="14" fill="#11161d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><text x="58" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">SDK · Protocol</text><text x="842" y="250" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#6e7681">axonos-sdk · axonos-protocol</text><text x="58" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">Capabilities · IntentObservation wire format</text><rect x="30" y="324" width="840" height="150" rx="14" fill="#11161d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><text x="58" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Consent</text><text x="842" y="368" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#6e7681">axonos-consent</text><text x="58" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">Withdrawal is a state transition, and it is bounded</text><rect x="58" y="430" width="386" height="34" rx="17" fill="#0b2a33" stroke="#2dd4ff" stroke-opacity="0.55"/><text x="75" y="453" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#2dd4ff">withdrawal ≤ 1,648 cycles · proven</text><rect x="30" y="488" width="840" height="150" rx="14" fill="#11161d" stroke="#2dd4ff" stroke-opacity="1" stroke-width="2"/><text x="58" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Kernel</text><text x="842" y="532" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#6e7681">axonos-kernel</text><text x="58" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">Scheduler · lock-free SPSC IPC · capabilities</text><rect x="58" y="594" width="282" height="34" rx="17" fill="#0b2a33" stroke="#2dd4ff" stroke-opacity="0.55"/><text x="75" y="617" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#2dd4ff">WCRT ≤ 1,000 µs · proven</text><rect x="352" y="594" width="251" height="34" rx="17" fill="#0b2a33" stroke="#2dd4ff" stroke-opacity="0.55"/><text x="369" y="617" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#2dd4ff">IPC ≤ 0.5 µs · proven</text><rect x="30" y="652" width="840" height="104" rx="14" fill="#11161d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><text x="58" y="698" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Signal pipeline</text><text x="842" y="696" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#6e7681">axonos-signal-pipeline</text><text x="58" y="736" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">Conditioning · DSP · classification, bit-exact</text><rect x="30" y="770" width="840" height="104" rx="14" fill="#11161d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><text x="58" y="816" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Hardware abstraction</text><text x="842" y="814" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#6e7681">axonos-hal</text><text x="58" y="854" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">ARM Cortex-M · #![no_std] Rust</text><rect x="30" y="888" width="840" height="104" rx="14" fill="#11161d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><text x="58" y="934" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Electrodes</text><text x="58" y="972" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">Tens of microvolts, through skin, bone and hair</text></svg>
